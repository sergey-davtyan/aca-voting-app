apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-secret-refresher
  labels:
    app: ecr-refresher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-secret-refresher
  labels:
    app: ecr-refresher
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-secret-refresher
  labels:
    app: ecr-refresher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecr-secret-refresher
subjects:
  - kind: ServiceAccount
    name: ecr-secret-refresher
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-secret-refresher
  labels:
    app: ecr-refresher
spec:
  # Runs every 6 hours (ECR tokens expire after 12 hours)
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ecr-secret-refresher
          restartPolicy: OnFailure
          containers:
            - name: ecr-refresher
              image: mikesir81/aws-kubectl:latest
              command:
                - "/bin/sh"
                - "-c"
                - |
                  set -e
                  REGION="eu-north-1"
                  REGISTRY="597936860210.dkr.ecr.${REGION}.amazonaws.com"
                  
                  echo "Fetching new ECR authorization token for ${REGISTRY}..."
                  TOKEN=$(aws ecr get-login-password --region ${REGION})
                  
                  echo "Updating ecr-secret in cluster..."
                  kubectl delete secret ecr-secret --ignore-not-found
                  kubectl create secret docker-registry ecr-secret \
                    --docker-server="${REGISTRY}" \
                    --docker-username=AWS \
                    --docker-password="${TOKEN}"
                  
                  echo "ecr-secret successfully refreshed!"
