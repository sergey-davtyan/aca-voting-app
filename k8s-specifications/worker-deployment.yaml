apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      imagePullSecrets:
      - name: ecr-secret
      containers:
      - name: worker
        # AWS ECR Private Registry Image
        image: 597936860210.dkr.ecr.eu-north-1.amazonaws.com/aca-voting-app-worker:latest
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: voting-app-config
        - secretRef:
            name: voting-app-secrets
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
